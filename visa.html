<body data-page="visa">
  <div id="preloader" class="preloader" aria-hidden="true">
    <div class="preloader__box">
      <img class="preloader__logo" src="assets/img/logo.png" alt="Vandana Travel Experts">
      <div class="preloader__route"><span class="preloader__plane"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span></div>
      <div class="preloader__bar"><i></i></div>
      <div class="preloader__tag">We Keep it Simple</div>
    </div>
  </div>

  <header id="site-header" class="site-header"></header>

  <section class="tool-hero tool-hero--visa">
    <div class="container">
      <div class="tool-hero__inner reveal in">
        <span class="eyebrow">Live Travel Info</span>
        <h1>Check <span class="grad">Visa Requirements</span></h1>
        <p>Know before you go — visa type, allowed stay, documents and official sources by destination.</p>
        <form class="tool-search tool-search--visa" id="visa-form">
          <div class="tool-select">
            <label>What passport do you hold?</label>
            <select id="visa-from" aria-label="Nationality"><option value="IN">🇮🇳 India</option></select>
          </div>
          <div class="tool-select">
            <label>Where are you travelling?</label>
            <select id="visa-to" aria-label="Destination"><option value="">Loading destinations…</option></select>
          </div>
          <button class="btn btn--primary" type="submit">Check Requirements</button>
        </form>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="container">
      <div id="visa-result" class="tool-result"></div>
    </div>
  </section>

  <footer id="site-footer" class="footer"></footer>
  <script src="assets/js/packages.js"></script>
  <script src="assets/js/site.js"></script>
