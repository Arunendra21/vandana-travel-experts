<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Vandana Travel Experts</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=8">
</head>
<body class="ad-login">
  <div class="ad-login__card">
    <img class="ad-login__logo" src="/assets/img/logo.png" alt="Vandana Travel Experts">
    <h1>Admin Login</h1>
    <p>Sign in to manage the Vandana Travel Experts website.</p>
    <form id="login-form" class="ad-form">
      <div class="ad-field"><label>Email</label><input id="login-email" type="email" autocomplete="username" required></div>
      <div class="ad-field"><label>Password</label><input id="login-pass" type="password" autocomplete="current-password" required></div>
      <button class="ad-btn ad-btn--pri" type="submit" style="width:100%;justify-content:center">Log In</button>
      <div class="ad-msg"></div>
    </form>
  </div>
  <script>
  (function () {
    function api(path, opts) {
      opts = opts || {};
      var o = { method: opts.method || "GET", headers: { Accept: "application/json" }, credentials: "same-origin" };
      if (opts.body !== undefined) { o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(opts.body); }
      return fetch(path, o).then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
        .catch(function () { return { ok: false, __net: true, message: "Couldn't reach the server. If you use Brave Shields or an ad-blocker, allow this site, then retry." }; });
    }
    // already logged in? go straight to the panel
    api("/api/admin/me").then(function (j) { if (j.ok) location.replace("index.html#/dashboard"); });
    var f = document.getElementById("login-form");
    var msg = f.querySelector(".ad-msg"), btn = f.querySelector('button[type=submit]');
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      btn.classList.add("is-loading"); btn.disabled = true; msg.className = "ad-msg"; msg.textContent = "";
      api("/api/admin/login", { method: "POST", body: { email: document.getElementById("login-email").value, password: document.getElementById("login-pass").value } })
        .then(function (j) {
          if (j.ok) { location.replace("index.html#/dashboard"); return; }
          msg.textContent = j.message || "Invalid email or password."; msg.className = "ad-msg err show";
          btn.classList.remove("is-loading"); btn.disabled = false;
        });
    });
  })();
  </script>
</body>
</html>
