<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Flight Status — Vandana Travel Experts</title>
  <meta name="description" content="Track any flight in real time with Vandana Travel Experts — live flight status, scheduled and estimated departure & arrival, terminals, gates and delays.">
  <link rel="canonical" href="https://travelvandana.com/flights.html">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#046bd2">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vandana Travel Experts">
  <meta property="og:title" content="Live Flight Status — Vandana Travel Experts">
  <meta property="og:description" content="Track any flight in real time — live status, departure & arrival times, terminals, gates and delays.">
  <meta property="og:url" content="https://travelvandana.com/flights.html">
  <meta property="og:image" content="https://travelvandana.com/assets/img/hero-dubai.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/img/logo.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=7">
</head>
<body data-page="flights">
  <div id="preloader" class="preloader" aria-hidden="true">
    <div class="preloader__box">
      <img class="preloader__logo" src="assets/img/logo.png?v=2" alt="Vandana Travel Experts">
      <div class="preloader__route"><span class="preloader__plane"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span></div>
      <div class="preloader__bar"><i></i></div>
      <div class="preloader__tag">We Keep it Simple</div>
    </div>
  </div>

  <header id="site-header" class="site-header"></header>

  <section class="tool-hero tool-hero--flights">
    <div class="container">
      <div class="tool-hero__inner reveal in">
        <span class="eyebrow">Live Travel Info</span>
        <h1>Live Flight <span class="grad">Status</span></h1>
        <p>Track any flight in real time — departure, arrival, terminals, gates and delays.</p>
        <form class="tool-search" id="flight-form" autocomplete="off">
          <div class="tool-search__field">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
            <input type="text" id="flight-input" name="flight" placeholder="Flight number — e.g. AI302, 6E5301, UK955" aria-label="Flight number" maxlength="8">
          </div>
          <button class="btn btn--primary" type="submit">Track Flight</button>
        </form>
        <p class="tool-hint">Enter the airline code + number (IATA), e.g. <b>AI302</b> (Air India), <b>6E2179</b> (IndiGo), <b>EK501</b> (Emirates).</p>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="container">
      <div id="flight-result" class="tool-result"></div>
    </div>
  </section>

  <footer id="site-footer" class="footer"></footer>
  <script src="assets/js/packages.js?v=7"></script>
  <script src="assets/js/site.js?v=7"></script>
</body>
</html>
