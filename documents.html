<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Travel Documents — Vandana Travel Experts</title>
  <meta name="description" content="Download detailed Vandana Travel Experts tour itineraries — day-by-day plans, inclusions and exclusions for pilgrimage and holiday packages, as ready-to-share PDFs.">
  <link rel="canonical" href="https://travelvandana.com/documents.html">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#046bd2">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vandana Travel Experts">
  <meta property="og:title" content="Travel Documents — Vandana Travel Experts">
  <meta property="og:description" content="Download detailed tour itineraries as ready-to-share PDFs — day-by-day plans, inclusions and exclusions.">
  <meta property="og:url" content="https://travelvandana.com/documents.html">
  <meta property="og:image" content="https://travelvandana.com/assets/img/pilg-varanasi.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/img/logo.png?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=15">
</head>
<body data-page="documents">
  <div id="preloader" class="preloader" aria-hidden="true">
    <div class="preloader__box">
      <img class="preloader__logo" src="assets/img/logo.png?v=4" alt="Vandana Travel Experts">
      <div class="preloader__route"><span class="preloader__plane"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span></div>
      <div class="preloader__bar"><i></i></div>
    </div>
  </div>

  <header id="site-header" class="site-header"></header>

  <section class="tool-hero tool-hero--docs">
    <div class="container">
      <div class="tool-hero__inner reveal in">
        <span class="eyebrow">Travel Documents</span>
        <h1>Itineraries &amp; <span class="grad">Travel Documents</span></h1>
        <p>Detailed, ready-to-share PDFs for our tours — day-by-day plans, inclusions and exclusions. View online or download to plan and share with your group.</p>
        <div class="docs-toolbar">
          <div class="docs-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="docs-search" placeholder="Search documents — e.g. Ayodhya, Varanasi, Mathura…" aria-label="Search documents">
          </div>
          <span class="docs-count" id="docs-count"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:26px">
    <div class="container">
      <div id="docs-library" class="docs-library">
        <div class="docs-loading"><span class="load-spin"></span> Loading documents…</div>
      </div>
    </div>
  </section>

  <footer id="site-footer" class="footer"></footer>
  <script src="assets/js/packages.js?v=15"></script>
  <script src="assets/js/site.js?v=15"></script>
</body>
</html>
